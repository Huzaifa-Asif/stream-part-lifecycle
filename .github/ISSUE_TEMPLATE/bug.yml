name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: input
    id: version
    attributes: { label: Version }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal reproduction, description: Remove secrets and personal data. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
